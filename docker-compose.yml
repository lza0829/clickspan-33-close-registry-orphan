services:
  backend:
    build: ./backend
    ports:
      - "10900:10900"
    volumes:
      - clickspan_data:/data
      - ./fixtures:/fixtures:ro
    environment:
      DATA_DIR: /data
      FIXTURES_DIR: /fixtures
  frontend:
    build: ./frontend
    ports:
      - "5900:80"
    depends_on:
      - backend
volumes:
  clickspan_data:
